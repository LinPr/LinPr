<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="45%" stop-color="#d90429"/>
      <stop offset="80%" stop-color="#9d0208"/>
      <stop offset="100%" stop-color="#370617"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <circle cx="50" cy="50" r="47" fill="#0b0b0f" stroke="#e23b3b" stroke-width="2"/>
    <circle cx="50" cy="50" r="39" fill="url(#iris)"/>
    <g opacity="0.35" stroke="#ff8a8a" stroke-width="0.8" fill="none">
      <circle cx="50" cy="50" r="33"/>
      <circle cx="50" cy="50" r="20"/>
    </g>
    <circle cx="50" cy="50" r="12" fill="#08080a"/>

    <g fill="#08080a">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                        from="0 50 50" to="360 50 50" dur="16s" repeatCount="indefinite"/>
      <g>
        <circle cx="50" cy="25" r="7"/>
        <path d="M57 25 C60 30 61 35 60 40 C56 36 53 33 50 31 Z"/>
      </g>
      <g transform="rotate(120 50 50)">
        <circle cx="50" cy="25" r="7"/>
        <path d="M57 25 C60 30 61 35 60 40 C56 36 53 33 50 31 Z"/>
      </g>
      <g transform="rotate(240 50 50)">
        <circle cx="50" cy="25" r="7"/>
        <path d="M57 25 C60 30 61 35 60 40 C56 36 53 33 50 31 Z"/>
      </g>
    </g>
  </g>
</svg>
